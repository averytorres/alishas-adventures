<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Princess & the Dragon</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="game">
<header><button id="home" aria-label="Home">⌂</button><strong id="brand">Princess & the Dragon</strong><div><button id="sound" aria-label="Toggle sound">♫</button><button id="parents" aria-label="Parent section">⚙</button></div></header>
<section class="scene" aria-label="Animated story scene"><div class="sun"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="castle">♜</div><div class="dragon" id="dragon"><span class="wing">◆</span><span class="head">🐉</span></div><div class="ground"></div><img class="princess-art" id="princess-art" src="assets/princess-adventure.png" alt="Princess Alisha"></section>
<section class="card"><p id="chapter"></p><h1 id="title"></h1><p id="story"></p><div id="choices"></div></section><footer id="footer">A tiny storybook adventure</footer>
</main>
<div id="parent-gate" class="overlay" hidden><div class="panel"><h2>Grown-ups</h2><p id="gate-question"></p><input id="gate-answer" type="number" inputmode="numeric" aria-label="Answer"><p id="gate-error" role="alert"></p><button id="gate-enter">Continue</button><button class="close" id="gate-cancel">Cancel</button></div></div>
<div id="parent-panel" class="overlay" hidden><div class="panel"><h2>Grown-ups</h2><label>Story language<select id="language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label><fieldset><legend>Choose your princess</legend><label><input type="radio" name="princess" value="adventure" checked><img src="assets/princess-adventure.png" alt="Adventurer princess"><span>Adventurer</span></label><label><input type="radio" name="princess" value="star"><img src="assets/princess-star.png" alt="Star princess"><span>Star princess</span></label></fieldset><button id="pin-toggle" hidden>Keep game open: Off — turn on</button><p id="pin-help">On Android, this starts screen pinning after you confirm Android's prompt. Your phone's app-pinning settings control whether a PIN is required to leave.</p><button class="close" id="parent-close">Back to story</button></div></div>
<script src="app.js"></script></body></html>
