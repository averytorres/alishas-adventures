<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alisha animation study — temporary</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e9dcf3;color:#332445;text-align:center}main{max-width:850px;margin:auto;padding:24px}h1{font-size:1.5rem}p{line-height:1.45}.banner{background:#6a3479;color:white;padding:10px;font-weight:bold}.characters{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}.card{background:#fff9f0;padding:12px 18px;border-radius:18px;min-width:260px}.sprite{width:225px;height:300px;margin:auto;background-repeat:no-repeat;background-size:900px 300px;background-position:0 0}.adventure{background-image:url('../assets/candidates/adventurer-4poses-TEMP.png')}.star{background-image:url('../assets/candidates/star-4poses-TEMP.png')}button{border:0;background:#704295;color:white;border-radius:10px;padding:10px 16px;margin:5px;font-size:1rem}.note{font-size:.9rem;color:#69485c}
</style></head><body><div class="banner">TEMPORARY ANIMATION STUDY — NOT FINAL ART</div><main><h1>Two Alisha animation studies</h1><p>These show a blink, mouth frame, and wave. They are frame swaps, not finished layered character rigs.</p><div class="characters"><div class="card"><h2>Adventurer</h2><div class="sprite adventure" data-sprite></div><button data-action="talk">Talk</button><button data-action="wave">Wave</button></div><div class="card"><h2>Star princess</h2><div class="sprite star" data-sprite></div><button data-action="talk">Talk</button><button data-action="wave">Wave</button></div></div><p class="note">The Star princess sheet has edge artifacts and needs cleanup before use in the game.</p></main><script>
const positions=['0%','33.333%','66.667%','100%'];function frame(sprite,index){sprite.style.backgroundPosition=positions[index]+' 0'}
document.querySelectorAll('.card').forEach(card=>{const sprite=card.querySelector('.sprite');let talking=false;let talkTimer;card.querySelector('[data-action=talk]').onclick=()=>{talking=!talking;clearInterval(talkTimer);if(talking)talkTimer=setInterval(()=>frame(sprite,Math.random()>.5?2:0),170);else frame(sprite,0)};card.querySelector('[data-action=wave]').onclick=()=>{talking=false;clearInterval(talkTimer);frame(sprite,3);setTimeout(()=>frame(sprite,0),1000)};setInterval(()=>{if(!talking){frame(sprite,1);setTimeout(()=>frame(sprite,0),140)}},4300)});
</script></body></html>
